[package]
name = "syscall-tracepoint-ebpf"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
aya-ebpf = "=0.2.1"
syscall-tracepoint-common = { path = "../syscall-tracepoint-common" }

[[bin]]
name = "syscall-tracepoint"
path = "src/main.rs"

[profile.dev]
opt-level = 2
panic = "abort"
overflow-checks = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace]
members = []
